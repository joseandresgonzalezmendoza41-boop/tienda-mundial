<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Carrito - Tienda Mundial</title>

    <link rel="stylesheet" href="bonito.css">

</head>

<body>

    <!-- Encabezado -->

    <header class="encabezado">

        <h1>Tienda Mundial</h1>

        <nav class="menu">

            <a href="index.html">Inicio</a>
            <a href="productos.html">Productos</a>
            <a href="contacto.html">Contacto</a>
            <a href="carrito.html">Carrito</a>

        </nav>

    </header>


    <!-- Carrito -->

    <main class="contenido">

        <h2>Mi Carrito</h2>

        <p>
            Estos son los productos seleccionados.
        </p>


        <!-- Producto 1 -->

        <article class="producto-carrito">

            <img
                class="imagen-carrito"
                src="PEGA_AQUI_LA_DIRECCION_DE_LA_IMAGEN"
                alt="Camiseta de Argentina">

            <div>

                <h3>Camiseta de Argentina</h3>

                <p>Cantidad: 1</p>

                <p class="precio">$89.900</p>

            </div>

        </article>


        <!-- Producto 2 -->

        <article class="producto-carrito">

            <img
                class="imagen-carrito"
                src="PEGA_AQUI_LA_DIRECCION_DE_LA_IMAGEN"
                alt="Camiseta de Colombia">

            <div>

                <h3>Camiseta de Colombia</h3>

                <p>Cantidad: 1</p>

                <p class="precio">$89.900</p>

            </div>

        </article>


        <!-- Total -->

        <section class="total">

            <h2>Total: $179.800</h2>

            <a class="boton" href="contacto.html">
                Continuar compra
            </a>

        </section>


    </main>

</body>

</html>
