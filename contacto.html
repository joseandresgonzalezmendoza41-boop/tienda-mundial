<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Contacto - Tienda Mundial</title>
    <link rel="stylesheet" href="bonito.css">
</head>

<body>

```
<!-- Encabezado -->
<header class="encabezado">

    <h1>⚽ Tienda Mundial</h1>
    <p>Camisetas y Zapatos Deportivos</p>

    <!-- Menú principal -->
    <nav class="menu">
        <a href="index.html">Inicio</a>
        <a href="productos.html">Productos</a>
        <a href="contacto.html">Contacto</a>
        <a href="carrito.html">Carrito 🛒</a>
    </nav>

</header>


<!-- Contenido de contacto -->
<main class="contacto">

    <h2>Contáctanos</h2>

    <p>
        ¿Tienes alguna pregunta sobre nuestros productos?
        Escríbenos y estaremos atentos para ayudarte.
    </p>

    <!-- Formulario -->
    <form>

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre">

        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="correo" placeholder="Escribe tu correo">

        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono" placeholder="Escribe tu teléfono">

        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje"></textarea>

        <button type="submit">Enviar mensaje</button>

    </form>

</main>
```

</body>

</html>
